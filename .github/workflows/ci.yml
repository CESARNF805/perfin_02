name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Valores fictícios só para o build compilar; nenhum segredo real entra no CI.
env:
  NEXT_PUBLIC_SITE_URL: https://ci.exemplo.com.br
  NEXT_PUBLIC_SUPABASE_URL: https://ci-ficticio.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_ficticio
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  aplicativo:
    name: Aplicativo (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Aplicativo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Aplicativo/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  website:
    name: Website (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  coleta-python:
    name: Coleta Python (testes, auditoria)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Aplicativo/scripts/indicadores
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Aplicativo/scripts/indicadores/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt
      - run: python -m pytest -q
