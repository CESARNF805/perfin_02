name: Coleta de indicadores (BCB)

on:
  schedule:
    # Dias úteis às 21h UTC (18h em Brasília), depois da PTAX e das divulgações do dia.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: coleta-indicadores
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Aplicativo/scripts/indicadores
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Aplicativo/scripts/indicadores/requirements.txt
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Coletar e gravar no Supabase
        env:
          INDICADORES_DATABASE_URL: ${{ secrets.INDICADORES_DATABASE_URL }}
        run: python coletar.py
