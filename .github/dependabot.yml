version: 2
updates:
  - package-ecosystem: npm
    directory: /Aplicativo
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dependencias-app: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /Website
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dependencias-site: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: pip
    directory: /Aplicativo/scripts/indicadores
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
